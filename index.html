<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Deals & Flight Booking</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0f172a;
      color: white;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background:
        linear-gradient(rgba(15, 23, 42, .8), rgba(15, 23, 42, .9)),
        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600&auto=format&fit=crop') center/cover;
    }

    .hero h1 {
      font-size: 3rem;
      max-width: 900px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero p {
      max-width: 700px;
      font-size: 1.2rem;
      color: #cbd5e1;
      margin-bottom: 40px;
    }

    .cta {
      background: #38bdf8;
      color: #000;
      padding: 15px 35px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      transition: .3s;
    }

    .cta:hover {
      background: #0ea5e9;
      transform: scale(1.05);
    }

    .widget-section {
      padding: 60px 20px;
      background: #111827;
    }

    .widget-container {
      max-width: 1200px;
      margin: auto;
      background: #1e293b;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 0 30px rgba(0, 0, 0, .4);
      min-height: 250px; 
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #020617;
      color: #94a3b8;
      font-size: .9rem;
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2rem;
      }

      .hero p {
        font-size: 1rem;
      }
      
      .widget-container {
        min-height: 450px; 
      }
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Find Cheap Flights & Travel Deals Worldwide</h1>
    <p>
      Compare flight prices, discover destinations,
      and book your next adventure at the best price.
    </p>
    <a href="#search" class="cta">
      Search Flights
    </a>
  </section>

  <!-- Search Widget Section -->
  <section class="widget-section" id="search">
    <div class="widget-container">

      <!-- The placeholder target div using your tracking ID (trs=534178) -->
      <div class="tp-widget-534178">
        
        <!-- Your brand new active script placed directly into the layout block -->
        <script async src="https://tpscr.com/content?currency=usd&trs=534178&shmarker=733931&locale=en&powered_by=true&limit=4&primary_color=00AE98&results_background_color=FFFFFF&form_background_color=FFFFFF&campaign_id=111&promo_id=3411" charset="utf-8"></script>
        
      </div>

    </div>
  </section>

  <!-- Footer Section -->
  <footer>
    &copy; 2026 Travel Deals. All rights reserved.
  </footer>

</body>
</html>
